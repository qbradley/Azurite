[package]
name = "azurite-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]

[dev-dependencies]
azure_storage = "0.21"
azure_storage_blobs = "0.21"
azure_core = "0.21"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
regex = "1"
bytes = "1"

[[test]]
name = "sdk_blob_tests"
path = "tests/sdk_blob_tests.rs"
